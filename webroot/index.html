      <div class="sp"></div>
      <b>① 管理器 WebUI（免配置）</b>

      <div class="sp"></div>

      <div>· 首页：内核 / ksud / 设备状态一览</div>

      <div>· 日志：ksud / sulog / dmesg 快速查看</div>

      <div class="sp"></div>

      <div>Root 授权开关保存在内核中，仅管理器 App 可修改；本页超级用户栏目提供日志与信息查询。</div>
