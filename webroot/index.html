      <b>这是什么？</b>
      <div>WebKSU 是一个网页版 KernelSU 管理器。支持两种运行方式：</div>
      <div class="sp"></div>
      <b>① 管理器 WebUI（免配置）</b>
      <div>刷入模块后在管理器 App「模块」页点击 WebUI 图标打开。</div>
      <div class="sp"></div>
      <b>② 独立服务（完全脱离管理器 App）</b>
      <div>模块开机脚本会以 Root 启动本地 HTTP 服务，手机任意浏览器打开 <b>http://127.0.0.1:18080</b> 即可管理，无需打开管理器。</div>

      <div class="sp"></div>
      <b>功能</b>
      <div>· 首页：内核 / ksud / 设备状态一览</div>
      <div>· 模块：安装 ZIP、启用/禁用、卸载、运行操作</div>

      <div>· 日志：ksud / sulog / dmesg 快速查看</div>
      <div>· 工具：Root 终端、feature 开关、umount、sepolicy、软重启</div>
      <div class="sp"></div>

      <div>Root 授权开关保存在内核中，仅管理器 App 可修改；本页超级用户栏目提供日志与信息查询。</div>
