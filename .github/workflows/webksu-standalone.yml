name: WebKSU Standalone Build

# 一键云端编译「独立版」：ksud 内嵌网页管理器 + patched kernelsu.ko
# ============================================================
# 产物：ksud-webksu-standalone-aarch64
#   替换 /data/adb/ksud 即可，无需任何模块、无需管理器 App
# 前置：把最新 webroot/index.html 提交到仓库根目录 webroot/index.html
#   （本地路径 G:/html/resukisu-webksu/webroot/index.html，
#    GitHub 网页上传即可；不提交也能编译，但内嵌的是占位页）
# 用法：Actions -> WebKSU Standalone Build -> Run workflow
# ============================================================

on:
  workflow_dispatch:

jobs:
  build-ko:
    name: Build patched kernelsu.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Add Safe Directory
        run: git config --global --add safe.directory /__w/ReSukiSU/ReSukiSU

      - name: Apply WebKSU patch
        run: |
          sed -i 's/\.perm_check = only_manager/.perm_check = manager_or_root/' kernel/supercall/dispatch.c
          echo "--- patched lines ---"
          grep -n -B2 'manager_or_root' kernel/supercall/dispatch.c | head -20
          test "$(grep -c 'only_manager' kernel/supercall/dispatch.c)" = "0"

      - name: Build kernelsu.ko
        run: |
          cd kernel
          CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y CC=clang make
          OUT_DIR=$GITHUB_WORKSPACE/out
          mkdir -p "$OUT_DIR"
          cp kernelsu.ko "$OUT_DIR/${{ matrix.kmi }}_kernelsu.ko"
          ls -la "$OUT_DIR"

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v7
        with:
          name: ko-${{ matrix.kmi }}
          path: out/${{ matrix.kmi }}_kernelsu.ko

  build-ksuinit:
    name: Build ksuinit (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build ksuinit
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cd userspace/ksuinit
          cargo build --package ksuinit --target=aarch64-linux-android --release

      - name: Upload ksuinit
        uses: actions/upload-artifact@v7
        with:
          name: ksuinit-aarch64
          path: userspace/ksuinit/target/aarch64-linux-android/release/ksuinit

  build-ksud:
    name: Build ksud with embedded web (aarch64)
    needs: [build-ko, build-ksuinit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Prepare LKM files (patched ko)
        run: cp ko-*/*_kernelsu.ko ./userspace/ksud/bin/aarch64/

      - name: Prepare ksuinit
        run: mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/

      - name: Install embedded web server module (web.rs)
        run: |
          echo '' | base64 -d > userspace/ksud/src/android/web.rs
          wc -c userspace/ksud/src/android/web.rs

      - name: Integrate into ksud (mod / cli / boot hooks)
        run: |
          set -e
          cd userspace/ksud
          # 1) 注册模块
          sed -i 's/^pub mod utils;/pub mod utils;\npub mod web;/' src/android/mod.rs
          grep -q 'pub mod web;' src/android/mod.rs
          # 2) Web 子命令（前台运行）
          sed -i 's|^    /// For developers|    /// Start embedded WebKSU web server (foreground)\n    Web,\n\n    /// For developers|' src/android/cli.rs
          grep -q '^    Web,$' src/android/cli.rs
          # 3) 子命令分发
          sed -i 's|^        Commands::Sulogd => sulog::run_sulogd(),|        Commands::Web => crate::android::web::serve_blocking(),\n        Commands::Sulogd => sulog::run_sulogd(),|' src/android/cli.rs
          grep -q 'Commands::Web => crate::android::web::serve_blocking()' src/android/cli.rs
          # 4) 开机自启：service + boot-completed 双保险
          sed -i 's|info!("on_services triggered!");|info!("on_services triggered!");\n    crate::android::web::ensure_started();|' src/android/init_event.rs
          sed -i 's|info!("on_boot_completed triggered!");|info!("on_boot_completed triggered!");\n    crate::android::web::ensure_started();|' src/android/init_event.rs
          grep -q 'web::ensure_started' src/android/init_event.rs
          echo "--- integration done ---"

      - name: Embed suctl (webksu_suctl)
        run: |
          mkdir -p userspace/ksud/suctl
          if [ -f suctl/webksu_suctl.aarch64 ]; then
            cp suctl/webksu_suctl.aarch64 userspace/ksud/suctl/
            echo "embedded suctl: $(wc -c < suctl/webksu_suctl.aarch64) bytes"
          else
            echo placeholder > userspace/ksud/suctl/placeholder
            echo "!! WARNING: suctl/webksu_suctl.aarch64 not committed, deploying disabled !!"
          fi

      - name: Embed web ui (webroot)
        run: |
          mkdir -p userspace/ksud/webroot
          if [ -f webroot/index.html ]; then
            cp webroot/index.html userspace/ksud/webroot/
            echo "embedded web ui: $(wc -c < webroot/index.html) bytes"
          else
            echo '<html><body>webroot/index.html not committed - see workflow header comment</body></html>' > userspace/ksud/webroot/index.html
            echo "!! WARNING: placeholder page embedded; commit webroot/index.html to repo root !!"
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: aarch64-linux-android
          components: rust-src

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Setup cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Assemble LKM bootstrap
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib -o userspace/ksud/.lkm_image_bootstrap.o userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd userspace/ksud/
          cargo ndk b -P 26 -t aarch64-linux-android -r -Z build-std-features="optimize_for_size" -Z trim-paths

      - name: Upload patched ksud (standalone)
        uses: actions/upload-artifact@v7
        with:
          name: ksud-webksu-standalone-aarch64
          path: userspace/ksud/target/aarch64-linux-android/release/ksud
